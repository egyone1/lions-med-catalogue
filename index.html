  <style>
    :root {
      --navy: #0d1b2e; --navy-2: #16263f; --navy-3: #1c273a;
      --gold: #b8933a; --gold-soft: #e8e1cf;
      --paper: #f2f0ec; --card: #fff; --ink: #1c273a; --muted: #6b7280; --line: #dcd8cf;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Poppins, Arial, sans-serif; font-size: 16px; line-height: 1.65; }
    html[lang="ar"] body { font-family: Cairo, Tahoma, Arial, sans-serif; line-height: 1.85; }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    h1, h2, h3 { line-height: 1.2; margin: 0; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    .eyebrow { color: var(--gold); font-size: .78rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; }
    html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: .9rem; }

    /* header */
    header { position: sticky; top: 0; z-index: 10; background: var(--navy); color: #fff; border-bottom: 3px solid var(--gold); }
    .bar { display: flex; align-items: center; gap: 16px; min-height: 60px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; font-family: Montserrat, Poppins, Arial, sans-serif; font-weight: 800; font-size: 1.12rem; text-decoration: none; white-space: nowrap; letter-spacing: .04em; direction: ltr; }
    .brand span { color: var(--gold); font-weight: 300; letter-spacing: .14em; }
    .brand .emb { width: 24px; height: 28px; color: var(--gold); flex: none; }
    @media (max-width: 390px) { .brand span { display: none; } }
    .hero-media { position: relative; }
    .hero-logo { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%); width: max-content; max-width: 94%; color: #fff; font-family: Montserrat, Arial, sans-serif; direction: ltr; text-align: left; text-shadow: 0 2px 18px rgba(0,0,0,.35); pointer-events: none; }
    .hl-top { display: flex; align-items: center; gap: .18em; font-size: clamp(2.5rem, 10.6vw, 7rem); line-height: 1; }
    .hl-top .emb { width: .78em; height: .92em; flex: none; margin-right: .06em; }
    .hl-b { font-weight: 800; letter-spacing: .01em; }
    .hl-m { font-weight: 200; letter-spacing: .03em; margin-left: .16em; position: relative; }
    .hl-m i { font-style: normal; font-weight: 300; color: var(--gold); position: absolute; top: -.18em; right: -.42em; font-size: .5em; }
    .hl-c { display: flex; justify-content: space-between; font-weight: 300; font-size: clamp(1.05rem, 4.5vw, 2.95rem); margin-top: .42em; padding: 0 .02em; }
    nav { display: flex; gap: 22px; margin-inline-start: auto; }
    nav a { text-decoration: none; font-size: .92rem; opacity: .85; }
    nav a:hover { opacity: 1; color: var(--gold); }
    .lang { margin-inline-start: 8px; background: none; border: 1px solid var(--gold); color: var(--gold); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer; }
    .lang:hover { background: var(--gold); color: var(--navy); }
    @media (max-width: 760px) {
      .brand { font-size: .92rem; gap: 7px; } .brand span { letter-spacing: .06em; } .brand .emb { width: 20px; height: 24px; }
      .bar { flex-wrap: wrap; row-gap: 0; min-height: 0; padding-top: 10px; }
      .lang { margin-inline-start: auto; }
      nav { order: 3; width: 100%; margin: 10px 0 0; padding: 9px 0 10px; gap: 22px; overflow-x: auto; white-space: nowrap; border-top: 1px solid rgba(255,255,255,.14); scrollbar-width: none; }
      nav::-webkit-scrollbar { display: none; }
    }

    /* hero */
    .hero { background: var(--navy); color: #fff; }
    .hero-img { width: 100%; height: min(520px, 87.3vw); object-fit: cover; object-position: 50% 62%; border-bottom: 4px solid var(--gold); }
    .hero-body { padding-top: 48px; padding-bottom: 56px; }
    .hero h1 { font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 700; margin: 14px 0 16px; }
    .hero h1 em { display: block; font-style: normal; color: var(--gold); }
    .hero p { max-width: 640px; font-size: 1.08rem; opacity: .9; margin: 0 0 28px; }
    .btns { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 8px; font-weight: 600; text-decoration: none; border: 1px solid transparent; }
    .btn-gold { background: var(--gold); color: var(--navy); }
    .btn-wa { background: #1fa855; color: #fff; }
    .btn-line { border-color: rgba(255,255,255,.4); color: #fff; }
    .btn-navy { background: var(--navy-3); color: #fff; }
    .btn:hover { filter: brightness(1.08); }

    /* sections */
    section { padding: 56px 0; scroll-margin-top: 62px; }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--navy-3); padding-bottom: 12px; margin-bottom: 24px; }
    .sec-head h2 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; }
    .group + .group { margin-top: 48px; }

    /* product cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { background: var(--card); border-inline-start: 5px solid var(--gold); box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 22px; display: flex; flex-direction: column; text-decoration: none; transition: transform .15s, box-shadow .15s; }
    a.card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(13,27,46,.14); }
    .card .ph { height: 190px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
    .card .ph img { max-height: 190px; width: auto; height: auto; }
    .card h3 { font-size: 1.35rem; font-weight: 700; }
    .card .sub { color: var(--gold); font-weight: 500; margin: 4px 0 14px; }
    .card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 14px; }
    .pill { background: var(--navy-3); color: #fff; border-radius: 6px; padding: 7px 12px; font-weight: 600; font-size: .92rem; white-space: nowrap; }
    .more { color: var(--gold); font-weight: 700; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
    html[lang="ar"] .more { letter-spacing: 0; font-size: .92rem; }
    .label { color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; margin: 0 0 4px; }
    html[lang="ar"] .label { letter-spacing: 0; font-size: .85rem; }
    .comp { list-style: none; margin: 0; padding: 0; font-size: .96rem; }
    .comp b { font-weight: 700; }
    .note { background: var(--gold-soft); border-inline-start: 5px solid var(--gold); padding: 22px 26px; margin-top: 28px; }
    .note p { margin: 6px 0 0; }
    .quote { text-align: center; font-style: italic; font-size: 1.2rem; max-width: 560px; margin: 40px auto 0; }
    .quote::after { content: ""; display: block; width: 70px; height: 2px; background: var(--gold); margin: 20px auto 0; }

    /* dark blocks */
    .dark { background: var(--navy); color: #fff; }
    .dark .sec-head { border-color: rgba(255,255,255,.2); }
    .dark h2.big { font-size: clamp(1.7rem, 5vw, 2.6rem); max-width: 620px; margin: 10px 0 18px; }
    .dark .lead { max-width: 860px; opacity: .9; margin: 0 0 30px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    .tile { background: var(--navy-2); border-top: 3px solid var(--gold); padding: 22px 24px; }
    .tile h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .tile p { margin: 0; opacity: .85; font-size: .95rem; }
    .cycle { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-top: 18px; }
    .step { border-top: 1px solid rgba(255,255,255,.2); padding-top: 16px; position: relative; }
    .step::before { content: ""; position: absolute; top: -2px; inset-inline-start: 0; width: 48px; height: 3px; background: var(--gold); }
    .step h3 { font-size: 1.1rem; } .step h3 span { color: var(--gold); margin-inline-end: 12px; }
    .step small { display: block; opacity: .75; margin: 6px 0; }
    .step p { margin: 0; opacity: .9; font-size: .95rem; }
    .logos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
    .logos div { background: #fff; border-radius: 10px; padding: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
    .logos img { height: 62px; width: auto; }

    /* contact */
    .contact { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .contact .tile a { color: #fff; font-size: 1.25rem; font-weight: 600; text-decoration: none; direction: ltr; unicode-bidi: embed; }
    .contact .tile a:hover { color: var(--gold); }
    footer { background: var(--navy); color: rgba(255,255,255,.6); font-size: .82rem; padding: 22px 0 30px; border-top: 1px solid rgba(255,255,255,.15); }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; }
    footer a { color: var(--gold); }
    .fab { position: fixed; bottom: 18px; inset-inline-end: 18px; z-index: 20; width: 56px; height: 56px; border-radius: 50%; background: #1fa855; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
    .fab svg, .btn svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
    .fab svg { width: 30px; height: 30px; fill: #fff; }

    /* product page */
    .back { display: inline-block; margin: 26px 0 6px; color: var(--gold); font-weight: 600; text-decoration: none; }
    .p-head { background: var(--card); border-inline-start: 5px solid var(--gold); box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 30px; display: grid; grid-template-columns: 280px 1fr; gap: 30px; align-items: center; }
    .p-head .ph { display: flex; justify-content: center; }
    .p-head .ph img { max-height: 320px; width: auto; height: auto; }
    .p-head h2 { font-size: clamp(1.3rem, 3.4vw, 1.8rem); font-weight: 500; margin: 8px 0 20px; }
    .p-head .comp { font-size: 1.1rem; margin-bottom: 22px; }
    .boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
    .box { background: var(--navy-3); color: #fff; border-radius: 8px; padding: 14px 18px; }
    .box small { display: block; color: var(--gold); font-size: .68rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    html[lang="ar"] .box small { letter-spacing: 0; font-size: .82rem; }
    .box b { font-size: 1.3rem; }
    .p-cols { columns: 2; column-gap: 56px; margin-top: 34px; }
    .p-sec { break-inside: avoid; margin-bottom: 30px; }
    .p-sec h3 { color: var(--gold); font-size: .8rem; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 14px; }
    html[lang="ar"] .p-sec h3 { letter-spacing: 0; font-size: 1rem; }
    .p-sec p { margin: 0 0 10px; }
    .p-sec ul { margin: 0; padding: 0; list-style: none; }
    .p-sec li { position: relative; padding-inline-start: 22px; margin-bottom: 10px; }
    .p-sec li::before { content: ""; position: absolute; inset-inline-start: 2px; top: .72em; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
    .admin { background: var(--navy-3); color: #fff; border-radius: 10px; padding: 26px 30px; margin-top: 10px; }
    .admin h3 { color: var(--gold); font-size: .8rem; letter-spacing: .26em; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,.2); padding-bottom: 12px; margin-bottom: 16px; }
    html[lang="ar"] .admin h3 { letter-spacing: 0; font-size: 1rem; }
    .admin .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
    .admin b { display: block; color: var(--gold); }
    .p-cta { display: flex; flex-wrap: wrap; gap: 12px; margin: 26px 0 0; }
    .p-page { padding-bottom: 60px; }
    .p-page h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); }
    @media (max-width: 760px) {
      section { padding: 40px 0; scroll-margin-top: 114px; }
      .hero-body { padding-top: 32px; padding-bottom: 40px; }
      .btns .btn, .p-cta .btn { flex: 1 1 140px; justify-content: center; }
      .grid { grid-template-columns: 1fr; }
      .card .ph, .card .ph img { height: 170px; max-height: 170px; }
      .card .ph img { height: auto; }
      .note { padding: 18px 20px; }
      .admin { padding: 22px 20px; }
      .fab { width: 50px; height: 50px; bottom: 14px; inset-inline-end: 14px; }
      .fab svg { width: 26px; height: 26px; }
      footer { padding-bottom: 76px; }
    }
    @media (max-width: 760px) { .p-head { grid-template-columns: 1fr; padding: 22px; } .p-cols { columns: 1; } .p-head .ph img { max-height: 240px; } }

    /* farmer's guide */
    .guide { background: #fff; border-bottom: 1px solid var(--line); }
    .guide .sec-head { margin-bottom: 14px; }
    .g-intro { max-width: 820px; margin: 0 0 14px; color: #3c4658; }
    .g-disc { display: flex; gap: 10px; align-items: flex-start; background: var(--gold-soft); border-radius: 10px; padding: 12px 16px; font-size: .9rem; margin-bottom: 26px; }
    .g-disc svg { flex: none; width: 20px; height: 20px; color: var(--gold); margin-top: 2px; }
    .gtabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .gtab { display: flex; flex-direction: column; width: 100%; text-align: start; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 0; overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s; }
    .gtab:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(13,27,46,.14); border-color: var(--gold); }
    .gt-img { position: relative; display: block; aspect-ratio: 16 / 9; background: var(--navy-2); }
    .gt-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .gtab:hover .gt-img img { transform: scale(1.05); }
    .gt-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(13,27,46,.55), transparent 55%); }
    .gtab .ico { position: absolute; z-index: 1; bottom: -22px; inset-inline-start: 16px; width: 48px; height: 48px; border-radius: 50%; background: var(--navy); color: var(--gold); border: 3px solid var(--paper); display: flex; align-items: center; justify-content: center; }
    .gtab .ico svg { width: 24px; height: 24px; }
    .gt-body { display: flex; align-items: center; gap: 10px; padding: 28px 16px 16px; }
    .gtab .txt { flex: 1; min-width: 0; }
    .gtab .num { display: block; color: var(--gold); font-size: .72rem; font-weight: 700; letter-spacing: .14em; }
    .gtab b { display: block; font-size: 1.05rem; line-height: 1.35; }
    .gtab small { display: block; color: var(--muted); font-size: .82rem; margin-top: 2px; }
    .gtab .chev { flex: none; width: 20px; height: 20px; color: var(--gold); transition: transform .2s; }
    html[dir="rtl"] .gtab .chev { transform: scaleX(-1); }
    .gtab[aria-expanded="true"] { background: var(--navy); color: #fff; border-color: var(--gold); box-shadow: 0 10px 24px rgba(13,27,46,.25); }
    .gtab[aria-expanded="true"] .ico { background: var(--gold); color: var(--navy); border-color: var(--navy); }
    .gtab[aria-expanded="true"] small { color: rgba(255,255,255,.7); }
    .gtab[aria-expanded="true"] .chev { transform: rotate(90deg); }
    /* search */
    .gsearch { background: var(--navy); color: #fff; border-radius: 16px; padding: 22px; margin: 6px 0 22px; box-shadow: 0 10px 26px rgba(13,27,46,.18); }
    .gs-box { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 4px 6px 4px 14px; border: 2px solid transparent; }
    html[dir="rtl"] .gs-box { padding: 4px 14px 4px 6px; }
    .gs-box:focus-within { border-color: var(--gold); }
    .gs-box svg { flex: none; width: 22px; height: 22px; color: var(--gold); }
    .gs-box input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 1.05rem; padding: 12px 0; color: var(--ink); background: transparent; }
    .gs-box input::-webkit-search-cancel-button { display: none; }
    .gs-clear { flex: none; border: 0; background: var(--paper); color: var(--muted); border-radius: 8px; padding: 8px 12px; font: inherit; font-size: .82rem; cursor: pointer; }
    .gs-hint { margin: 8px 2px 0; font-size: .82rem; opacity: .7; }
    .gs-pop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
    .gs-pop > span { font-size: .85rem; opacity: .8; margin-inline-end: 4px; }
    .qchip { font: inherit; font-size: .84rem; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff; border-radius: 999px; padding: 5px 13px; cursor: pointer; }
    .qchip:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }
    #gres:not(:empty) { margin-top: 16px; }
    .gs-meta { font-size: .85rem; opacity: .8; margin-bottom: 8px; }
    .gs-list { display: grid; gap: 8px; }
    .gs-item { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: start; font: inherit; color: var(--ink); background: #fff; border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: transform .12s, box-shadow .12s; }
    .gs-item:hover, .gs-item:focus-visible { transform: translateY(-1px); box-shadow: 0 0 0 2px var(--gold); outline: none; }
    .gs-item .th { flex: none; width: 54px; height: 54px; border-radius: 10px; overflow: hidden; background: var(--paper); display: flex; align-items: center; justify-content: center; color: var(--gold); }
    .gs-item .th img { width: 100%; height: 100%; object-fit: cover; }
    .gs-item .th svg { width: 26px; height: 26px; }
    .gs-item .bd { flex: 1; min-width: 0; }
    .gs-item .where { display: block; font-size: .74rem; font-weight: 700; color: var(--gold); letter-spacing: .04em; }
    .gs-item b { display: block; font-size: 1rem; }
    .gs-item .sn { display: block; font-size: .88rem; color: #4a5468; margin-top: 2px; }
    .gs-none { background: rgba(255,255,255,.08); border-radius: 10px; padding: 14px; font-size: .95rem; }
    mark { background: #f6df9d; color: inherit; border-radius: 3px; padding: 0 2px; }
    .flash { animation: flash 2.2s ease; }
    @keyframes flash { 0%, 35% { box-shadow: 0 0 0 3px var(--gold); background: #fff8e6; } 100% { box-shadow: none; } }
    tr.flash td { animation: flash 2.2s ease; }
    /* panel hero, images, galleries */
    .gp-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: center; margin-bottom: 10px; }
    .gp-hero > img { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; }
    .gp-top { display: flex; justify-content: flex-end; margin: -8px 0 8px; }
    .acc-th { flex: none; width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: var(--paper); }
    .acc-th img { width: 100%; height: 100%; object-fit: cover; }
    .acc-fig { float: inline-end; width: 220px; margin: 12px 0 10px; margin-inline-start: 18px; }
    .acc-fig img { width: 100%; height: auto; border-radius: 10px; }
    .acc dl::after { content: ""; display: block; clear: both; }
    figcaption, .credit { font-size: .72rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .credit a { color: inherit; }
    .hcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin: 14px 0; }
    .hcard { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
    .hcard:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(13,27,46,.10); }
    .hcard > img { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; background: var(--paper); }
    .hcard .hb { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .hcard h5 { margin: 0; font-size: 1.05rem; color: var(--navy); }
    .hcard .cmp { font-size: .8rem; color: var(--gold); font-weight: 700; }

function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);

function parseQuery(q) {

    toks.push({ alts: [...new Set(alts)], raw: w });

}

      if (t.alts.some(x => (' ' + e.hay).includes(' ' + x))) s += 2;

  return { res: res.slice(0, 25), toks, fuzzy, total: res.length };
}

function hlRegex(toks) {

  if (!res.length) { box.innerHTML = `<div class="gs-none">${S.none}</div>`; return; }
  const tabOf = (id) => g.tabs.find(t => t.id === id);
  box.innerHTML = `<div class="gs-meta">${fuzzy ? S.fuzzy + ' ' : ''}${total} ${S.count}</div><div class="gs-list">${res.map(({ e }) => {
    const tb = e.tab && tabOf(e.tab);
    const th = e.img ? imgTag(e.img, e.title) : e.pimg ? `<img src="assets/${e.pimg}" alt="" loading="lazy">` : icon(tb ? tb.icon : 'box');
    return `<button type="button" class="gs-item" ${e.href ? `data-href="${e.href}"` : `data-tab="${e.tab}" data-k="${e.k}"`}>
      <span class="th">${th}</span>
      <span class="bd"><span class="where">${tb ? tb.title : S.products}</span><b>${hl(strip(e.title), re)}</b>${strip(e.text).trim() === strip(e.title).trim() ? '' : `<span class="sn">${snippet(e.text, re)}</span>`}</span>
    </button>`;
  }).join('')}</div>`;
}

function goTo(tab, k) {
  setTab(tab, !k);
  if (!k) return;
  const el = document.querySelector(`#gpanel [data-k="${k}"]`);
  if (!el) return;
  if (el.tagName === 'DETAILS') el.open = true;
  el.hidden = false;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

let qTimer = null;
document.getElementById('app').addEventListener('input', (ev) => {
  if (ev.target.id !== 'gq') return;
  clearTimeout(qTimer); qTimer = setTimeout(() => renderResults(ev.target.value), 120);
});
document.getElementById('app').addEventListener('keydown', (ev) => {
  if (ev.target.id !== 'gq') return;
  if (ev.key === 'Enter') { ev.preventDefault(); renderResults(ev.target.value); const f = document.querySelector('.gs-item'); if (f) f.click(); }
  if (ev.key === 'Escape') { ev.target.value = ''; renderResults(''); }
});

document.getElementById('app').addEventListener('click', (ev) => {
  const qc = ev.target.closest('.qchip');
  if (qc) { const inp = document.getElementById('gq'); inp.value = qc.dataset.q; renderResults(inp.value); return; }
  if (ev.target.closest('[data-gclear]')) { const inp = document.getElementById('gq'); inp.value = ''; renderResults(''); inp.focus(); return; }
  const it = ev.target.closest('.gs-item');
  if (it) { if (it.dataset.href) location.hash = it.dataset.href; else goTo(it.dataset.tab, it.dataset.k); return; }
  const tab = ev.target.closest('.gtab');
  if (tab) return setTab(tab.dataset.tab === openTab ? null : tab.dataset.tab, true);
  if (ev.target.closest('[data-close]')) { setTab(null); document.getElementById('guide').scrollIntoView({ behavior: 'smooth' }); return; }
  const chip = ev.target.closest('.chip');
  if (chip && chip.closest('.gpanel')) {
    const p = chip.closest('.gpanel'), f = chip.dataset.f;
    p.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
    p.querySelectorAll('.acc[data-tags]').forEach(a => { a.hidden = !!f && a.dataset.tags !== '' && !a.dataset.tags.split(' ').includes(f); });
  }
});

let shown = null;
function render(e) {
  const t = UI[lang], h = location.hash;
  const m = h.match(/^#\/p\/([a-z]+)$/);
  const id = m && P[m[1]] ? m[1] : null;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = id ? P[id].name + ' — Birds Med Company' : t.title;
  document.getElementById('nav').innerHTML = t.nav.map(n => `<a href="${n[0]}">${n[1]}</a>`).join('');
  document.getElementById('lang').textContent = t.other;
  document.getElementById('fab').href = wa();
  document.getElementById('fab').setAttribute('aria-label', t.waT);
  document.getElementById('foot').innerHTML = `<span>${t.disclaimer}</span><span>${t.vet} · ${t.edition}</span>`;
  const gm = h.match(/^#\/guide\/([a-z]+)$/);
  const key = lang + ':' + (id || 'home');
  if (key === shown && e) { if (gm) setTab(gm[1], true); return; }
  shown = key;
  const keepTab = !id && !e ? openTab : null;
  document.getElementById('app').innerHTML = id ? product(id, t) : home(t);
  if (id) scrollTo(0, 0);
  else if (gm || keepTab) setTab(gm ? gm[1] : keepTab, !!gm);
  else if (h.length > 1 && !h.startsWith('#/')) { const el = document.getElementById(h.slice(1)); if (el) el.scrollIntoView(); }
}

document.getElementById('lang').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
});
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
