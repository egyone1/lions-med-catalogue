        <a class="btn btn-gold" href="#products">${t.browse}</a>
        <a class="btn btn-wa" href="${wa()}" target="_blank" rel="noopener">${WA_ICON}${t.wa}</a>
        <a class="btn btn-line" href="tel:+${TEL_INTL}">${t.call} <span dir="ltr">${TEL}</span></a>
      </div>
    </div>
  </div>
  <section id="products"><div class="wrap">
    ${t.groups.map(g => `<div class="group">
      <div class="sec-head"><h2>${g[0]}</h2><span class="eyebrow">${g[1]}</span></div>
      <div class="grid">${g[2].map(id => card(id, t)).join('')}</div>
    </div>`).join('')}
    <div class="note"><div class="eyebrow">${t.noteT}</div>${t.note.map(n => `<p>${n}</p>`).join('')}</div>
    <p class="quote">${t.quote1}</p>
  </div></section>
  <section class="dark" id="feed"><div class="wrap">
    <div class="eyebrow">${t.feedEyebrow}</div>
    <h2 class="big">${t.feedH}</h2>
    <p class="lead">${t.feedP}</p>
    <div class="tiles">${t.tiles.map(x => `<div class="tile"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>
    <div class="eyebrow" style="margin-top:44px">${t.cycleT}</div>
    <div class="cycle">${t.cycle.map((c, i) => `<div class="step"><h3><span>0${i + 1}</span>${c[0]}</h3><small>${c[1]}</small><p>${c[2]}</p></div>`).join('')}</div>
  </div></section>
  <section id="partners"><div class="wrap">
    <div class="sec-head"><h2>${t.partnersH}</h2></div>
    <p style="margin-top:0">${t.partnersP}</p>
    <div class="logos">${LOGOS.map(l => `<div><img src="assets/${l[0]}" alt="${l[1]}" width="204" height="76"></div>`).join('')}</div>
    <div class="tiles" style="margin-top:34px">
      <div><div class="eyebrow">${t.rangeT}</div><p>${t.rangeP}</p></div>
      <div><div class="eyebrow">${t.qualT}</div><p>${t.qualP}</p></div>
    </div>
  </div></section>
  ${contact(t)}`;
}

function contact(t) {
  return `<section class="dark" id="contact"><div class="wrap">
    <div class="sec-head"><h2>${t.contactH}</h2><span class="eyebrow">Lions Med Company</span></div>
    <div class="contact">
      <div class="tile"><div class="eyebrow">${t.tel}</div><a href="tel:+${TEL_INTL}">${TEL}</a></div>
      <div class="tile"><div class="eyebrow">${t.waT}</div><a href="${wa()}" target="_blank" rel="noopener">${TEL}</a></div>
      <div class="tile"><div class="eyebrow">${t.addrT}</div><p style="font-size:1.15rem;opacity:1">${t.addr}</p></div>
    </div>
  </div></section>`;
}

function product(id, t) {
  const p = P[id], d = p[lang];
  const sec = (s) => `<div class="p-sec"><h3>${s[0]}</h3>${s.slice(1).map(x => typeof x === 'string' ? `<p>${x}</p>` : items(x)).join('')}</div>`;
  return `<div class="wrap p-page">
    <a class="back" href="#products">${t.back}</a>
    <div class="sec-head"><h1>${p.name}</h1><span class="eyebrow">${d.sub}</span></div>
    <div class="p-head">
      <div class="ph"><img src="assets/${p.img}" alt="${p.name}" ${dims(p.img)}></div>
      <div>
        <div class="eyebrow">${d.tag}</div>
        <h2>${d.head}</h2>
        <p class="label">${d.compL}</p>${comp(d.comp)}
        <div class="boxes">
          <div class="box"><small>${d.doseL || t.dosage}</small><b>${d.dose}</b></div>
          ${d.pack ? `<div class="box"><small>${t.packaging}</small><b>${d.pack}</b></div>` : ''}
        </div>
      </div>
    </div>
    ${d.secs.length ? `<div class="p-cols">${d.secs.map(sec).join('')}</div>` : '<div style="height:30px"></div>'}
    <div class="admin"><h3>${t.admin}</h3><div class="cols">${d.admin.map(a => `<div><b>${a[0]}</b>${a[1]}</div>`).join('')}</div></div>
    <div class="note"><div class="eyebrow">${t.noteT}</div>${t.note.map(n => `<p>${n}</p>`).join('')}</div>
    <div class="p-cta">
      <a class="btn btn-wa" href="${wa(t.waMsg + p.name)}" target="_blank" rel="noopener">${WA_ICON}${t.ask}</a>
      <a class="btn btn-navy" href="tel:+${TEL_INTL}">${t.call} <span dir="ltr">${TEL}</span></a>
    </div>
  </div>${contact(t)}`;
}

let shown = null;
function render(e) {
  const t = UI[lang], h = location.hash;
  const m = h.match(/^#\/p\/([a-z]+)$/);
  const id = m && P[m[1]] ? m[1] : null;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = id ? P[id].name + ' — Lions Med Company' : t.title;
  document.getElementById('nav').innerHTML = t.nav.map(n => `<a href="${n[0]}">${n[1]}</a>`).join('');
  document.getElementById('lang').textContent = t.other;
  document.getElementById('fab').href = wa();
  document.getElementById('fab').setAttribute('aria-label', t.waT);
  document.getElementById('foot').innerHTML = `<span>${t.disclaimer}</span><span>${t.vet} · ${t.edition} · <a href="catalogue.html">${t.print}</a></span>`;
  const key = lang + ':' + (id || 'home');
  if (key === shown && e) return;
  shown = key;
  document.getElementById('app').innerHTML = id ? product(id, t) : home(t);
  if (id) scrollTo(0, 0);
  else if (h.length > 1 && !h.startsWith('#/')) { const el = document.getElementById(h.slice(1)); if (el) el.scrollIntoView(); }
}

document.getElementById('lang').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
});
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
